name: Build Naki-M IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Naki.xcodeproj \
            -scheme Naki-M

      - name: Archive Naki-M
        run: |
          rm -rf build-ios dist

          xcodebuild archive \
            -project Naki.xcodeproj \
            -scheme Naki-M \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build-ios/Naki-M.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          IOS_APP=$(find "$PWD/build-ios/Naki-M.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" -type d | head -1)

          if [ -z "$IOS_APP" ]; then
            echo "Could not find the archived iOS app."
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/naki-ipa"
          mkdir -p "$RUNNER_TEMP/naki-ipa/Payload" dist
          cp -R "$IOS_APP" "$RUNNER_TEMP/naki-ipa/Payload/"

          (
            cd "$RUNNER_TEMP/naki-ipa"
            zip -r -y -q "$GITHUB_WORKSPACE/dist/Naki-M.ipa" Payload
          )

          echo "Built:"
          ls -lh dist/Naki-M.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Naki-M-unsigned
          path: dist/Naki-M.ipa
          if-no-files-found: error
          retention-days: 14
